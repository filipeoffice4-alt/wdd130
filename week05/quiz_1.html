<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>French Revolution Quiz</title>
    <link rel="stylesheet" href="styles/quiz1.css">
</head>

<body>
    <header>
        <h1>French Revolution Quiz</h1>
    </header>

    <main>
        <form>
            <div class="question">
                <label for="q1">1. What was the name of the fortress-prison stormed by the people on July 14, 1789?</label>
                <input type="text" id="q1" name="q1">
            </div>

            <div class="question">
                <label for="q2">2. Name one cause of the French Revolution.</label>
                <textarea id="q2" name="q2" rows="4"></textarea>
            </div>

            <div class="question">
                <label for="q3">3. What was the motto of the French Revolution?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="liberty">Liberty, Equality, Fraternity</option>
                    <option value="order">Order and Progress</option>
                    <option value="god">God, Country and Family</option>
                </select>
            </div>

            <div class="question">
                <label for="q4">4. In what year was King Louis XVI executed?</label>
                <input type="number" id="q4" name="q4">
            </div>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>

    <footer>
        <p>©2026 | French Revolution Quiz | Filipe Araújo</p>
    </footer>
</body>

</html>
