    <header>
        <img src="images/logo.png" alt="Exciting Expeditions logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="contact-layout">
            <div class="lleft-side">
                <section class="Information">
                    <h2>Contact Information</h2>
                    <p>Phone: (número)</p>
                    <p>Address: (endereço)</p>
                </section>
                <section class="Map">
                    <h2> Find us</h2>
                    <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d1955.2745236236667!2d-48.49929995011918!3d-24.818173337805145!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94db4d189fc712af%3A0x65353526f17531e5!2sRafting!5e0!3m2!1sen!2sbr!4v1795825952822!5m2!1sen!2sbr" width="300" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </section>
            </div>
            <section class="Request">
                <h2>Request Information</h2>
                <form action="#" method="post">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>

                    <label for="purpose">Contact Purpose</label>
                    <select id="purpose" name="purpose">
                        <option value="" selected disabled>Choose One ...</option>
                        <option value="General">General Inquiry</option>
                        <option value="Reservation">Reservation Question</option>
                        <option value="Suggestion">Website Suggestion</option>
                    </select>
                    <label for="Text-Message">Message</label>
                    <textarea name="Text-Message" id="Text-Message" rows="4"></textarea>

                    <button type="submit">Send</button>
                </form>
            </section>
        </div>
    </main>
